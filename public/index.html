<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDChat Platform - Secure Entry</title>
    <!-- Link to your new clean style file -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="auth-container">
    <div class="brand-header">
        <h1 id="main-title">Login ChatApp</h1>
        <p id="main-subtitle">Welcome back! Please enter your details.</p>
    </div>

    <!-- PANEL 1: LOGIN -->
    <div class="form-panel active" id="login-panel">
        <div class="input-group">
            <label>Email or Phone Number</label>
            <input type="text" id="login-identifier" placeholder="example@mail.com or +234..." required />
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-container-box">
                <input type="password" id="login-password" placeholder="•••••" required />
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password', this)">Show</button>
            </div>
        </div>
        <div class="extra-options">
            <label class="remember-me">
                <input type="checkbox" id="login-remember"> Remember me
            </label>
        </div>
        <button class="submit-btn" onclick="submitLogin()">Login</button>
        <div class="switch-prompt">
            Don't have an account? <a href="#" onclick="switchPanel('signup'); return false;">Sign Up</a>
        </div>
    </div>

    <!-- PANEL 2: REGISTRATION -->
    <div class="form-panel" id="signup-panel">
        <div class="profile-picker-container">
            <div class="avatar-preview" onclick="document.getElementById('avatar-file').click()">
                <span id="avatar-icon">📷</span>
                <img id="avatar-img" src="" alt="Avatar Preview">
            </div>
            <input type="file" id="avatar-file" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
            <label style="font-size: 12px; color: var(--text-muted);">Upload Profile Picture</label>
        </div>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="signup-username" placeholder="Choose a public username" required />
        </div>
        <div class="input-group">
            <label>Contact Type</label>
            <select id="signup-type" onchange="toggleSignupInput()" style="width:100%; background:var(--bg-main); border:1px solid var(--border); padding:12px; border-radius:8px; color:white; outline:none;">
                <option value="email">Email Address</option>
                <option value="phone">Phone Number</option>
            </select>
        </div>
        <div class="input-group">
            <label id="signup-contact-label">Email Address</label>
            <input type="text" id="signup-contact" placeholder="name@domain.com" required />
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-container-box">
                <input type="password" id="signup-password" placeholder="Create secure password" required />
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signup-password', this)">Show</button>
            </div>
        </div>
        <button class="submit-btn" onclick="submitSignup()">Create Account</button>
        <div class="switch-prompt">
            Already have an account? <a href="#" onclick="switchPanel('login'); return false;">Login</a>
        </div>
    </div>

    <!-- PANEL 3: OTP VERIFICATION -->
    <div class="form-panel" id="otp-panel">
        <div style="text-align: center; margin-bottom: 16px;">
            <p style="font-size: 14px; color: var(--text-muted);">We sent a 4-digit verification code to:</p>
            <p id="otp-target-display" style="font-weight: 600; color: #0fb682; margin-top: 4px; font-size: 15px;"></p>
        </div>
        <div class="otp-box-container">
            <input type="text" class="otp-input" maxlength="1" oninput="moveOtpFocus(this, 'otp2')" id="otp1">
            <input type="text" class="otp-input" maxlength="1" oninput="moveOtpFocus(this, 'otp3')" id="otp2">
            <input type="text" class="otp-input" maxlength="1" oninput="moveOtpFocus(this, 'otp4')" id="otp3">
            <input type="text" class="otp-input" maxlength="1" oninput="verifyOtpSubmit()" id="otp4">
        </div>
        <button class="submit-btn" onclick="verifyOtpSubmit()">Verify Code</button>
        <p class="resend-text">Didn't receive code? <span onclick="resendOtpCode()">Resend Code</span></p>
    </div>
</div>

<script>
    let activeSessionTarget = ""; 
    let base64Avatar = "";

    function togglePasswordVisibility(inputId, buttonEl) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            buttonEl.innerText = "Hide";
        } else {
            input.type = "password";
            buttonEl.innerText = "Show";
        }
    }

    function switchPanel(type) {
        document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
        if (type === 'login') {
            document.getElementById('main-title').innerText = "Login ChatApp";
            document.getElementById('main-subtitle').innerText = "Welcome back! Please enter your details.";
            document.getElementById('login-panel').classList.add('active');
        } else if (type === 'signup') {
            document.getElementById('main-title').innerText = "Create Account";
            document.getElementById('main-subtitle').innerText = "Join GDChat platform today.";
            document.getElementById('signup-panel').classList.add('active');
        } else if (type === 'otp') {
            document.getElementById('main-title').innerText = "Security Check";
            document.getElementById('main-subtitle').innerText = "Enter the confirmation OTP code.";
            document.getElementById('otp-panel').classList.add('active');
        }
    }

    function toggleSignupInput() {
        const type = document.getElementById('signup-type').value;
        const label = document.getElementById('signup-contact-label');
        const input = document.getElementById('signup-contact');
        if (type === 'email') {
            label.innerText = "Email Address";
            input.placeholder = "name@domain.com";
            input.type = "email";
        } else {
            label.innerText = "Phone Number";
            input.placeholder = "+234...";
            input.type = "tel";
        }
    }

    function previewAvatar(event) {
        const input = event.target;
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById('avatar-img');
                const icon = document.getElementById('avatar-icon');
                img.src = reader.result;
                img.style.display = "block";
                icon.style.display = "none";
                base64Avatar = reader.result; 
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function moveOtpFocus(current, nextId) {
        if (current.value.length === 1) {
            document.getElementById(nextId).focus();
        }
    }

    async function submitLogin() {
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;

        if(!identifier || !password) {
            alert("Please fill in your details.");
            return;
        }

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const data = await response.json();

            if (!response.ok) {
                alert(data.error || "Login failed.");
                return;
            }

            activeSessionTarget = identifier;
            document.getElementById('otp-target-display').innerText = identifier;
            switchPanel('otp');
        } catch (err) {
            alert("Connection error.");
        }
    }

    async function submitSignup() {
        const username = document.getElementById('signup-username').value.trim();
        const contact = document.getElementById('signup-contact').value.trim();
        const password = document.getElementById('signup-password').value;
        const type = document.getElementById('signup-type').value;

        if(!username || !contact || !password) {
            alert("All fields are required.");
            return;
        }

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, contact, password, type, avatar: base64Avatar })
            });
            const data = await response.json();

            if(!response.ok) {
                alert(data.error || "Registration rejected.");
                return;
            }

            alert("Account registered! Opening verification screen.");
            activeSessionTarget = contact;
            document.getElementById('otp-target-display').innerText = contact;
            switchPanel('otp');
        } catch (err) {
            alert("Registration network error.");
        }
    }

    async function verifyOtpSubmit() {
        const otpCode = document.getElementById('otp1').value + 
                        document.getElementById('otp2').value + 
                        document.getElementById('otp3').value +
