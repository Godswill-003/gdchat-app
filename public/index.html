<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDChat Platform</title>
    <style>
        :root {
            --bg-color: #efeae2; --header-bg: #075e54; --header-text: #ffffff;
            --bubble-sent: #dcf8c6; --bubble-received: #ffffff; --text-main: #303030;
            --text-muted: #727272; --footer-bg: #f0f0f0; --input-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #0b141a; --header-bg: #202c33; --header-text: #e9edef;
            --bubble-sent: #005c4b; --bubble-received: #202c33; --text-main: #e9edef;
            --text-muted: #8696a0; --footer-bg: #202c33; --input-bg: #2a3942;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Interactive Auth Window Screen with Winter Cabin Concept Background */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('https://unsplash.com') no-repeat center center/cover;
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .auth-container { background: rgba(32, 44, 51, 0.85); backdrop-filter: blur(10px); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 90%; max-width: 380px; text-align: center; color: #ffffff; }
        .auth-container h2 { margin-bottom: 20px; color: #34b7f1; font-size: 1.8rem; }
        .auth-container input { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px; font-size: 1rem; background: #ffffff; color: #303030; outline: none; }
        .auth-btn { width: 100%; padding: 12px; background: #e9edef; color: #202c33; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .auth-switch { margin-top: 15px; font-size: 0.85rem; color: #8696a0; cursor: pointer; text-decoration: underline; }
        
        /* Main Application Dashboard Window */
        .app-container { display: none; width: 100vw; height: 100vh; flex-direction: column; }
        header { background-color: var(--header-bg); color: var(--header-text); padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 35%; border-right: 1px solid var(--text-muted); background: var(--input-bg); overflow-y: auto; }
        .sidebar-title { padding: 12px; font-size: 0.9rem; background: var(--footer-bg); color: var(--text-muted); font-weight: bold; }
        .user-item { padding: 15px; border-bottom: 1px solid var(--footer-bg); cursor: pointer; font-weight: bold; }
        .user-item:hover { background: var(--bg-color); }
        
        .chat-area { width: 65%; display: flex; flex-direction: column; background: var(--bg-color); }
        .chat-screen { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; position: relative; font-size: 0.95rem; display: flex; flex-direction: column; }
        .bubble.sent { background-color: var(--bubble-sent); align-self: flex-end; border-top-right-radius: 0; }
        .bubble.received { background-color: var(--bubble-received); align-self: flex-start; border-top-left-radius: 0; }
        .delete-msg-btn { font-size: 0.65rem; color: red; cursor: pointer; text-align: right; margin-top: 4px; display: none; }
        .bubble.sent:hover .delete-msg-btn { display: block; }
        
        .input-wrapper { background-color: var(--footer-bg); padding: 10px; display: flex; align-items: center; gap: 8px; }
        .input-wrapper input { flex: 1; background-color: var(--input-bg); border: none; padding: 12px; border-radius: 20px; color: var(--text-main); outline: none; }
        .send-btn { background: transparent; border: none; font-size: 1.5rem; color: var(--header-bg); cursor: pointer; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- Unified Form Context Container -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-container">
            <h2 id="authTitle">Login ChatApp</h2>
            <input type="text" id="authUsername" placeholder="Enter username" autocomplete="off">
            <input type="password" id="authPassword" placeholder="Enter Password">
            <button class="auth-btn" id="authSubmitBtn">Login</button>
            <div class="auth-switch" id="authSwitchMode">Don't have an account?</div>
        </div>
    </div>

    <div class="app-container" id="appScreen">
        <header>
            <span id="welcomeLabel">GDChat</span>
            <button onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light')" style="background: transparent; color: white; border: 1px solid white; padding: 4px 8px; border-radius: 4px; cursor: pointer;">Theme</button>
        </header>
        <div class="main-layout">
            <div class="sidebar">
                <div class="sidebar-title">ONLINE CONTACTS</div>
                <div id="userList"></div>
            </div>
            <div class="chat-area">
                <div class="chat-screen" id="chatScreen"></div>
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Select an online contact to text..." disabled>
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let myUsername = "";
        let activeTargetUser = "";
        let isLoginMode = true;

        const authOverlay = document.getElementById('authOverlay');
        const appScreen = document.getElementById('appScreen');
        const authTitle = document.getElementById('authTitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authSwitchMode = document.getElementById('authSwitchMode');
        
        authSwitchMode.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            authTitle.textContent = isLoginMode ? "Login ChatApp" : "Create Account";
            authSubmitBtn.textContent = isLoginMode ? "Login" : "Sign Up";
            authSwitchMode.textContent = isLoginMode ? "Don't have an account?" : "Already have an account? Login";
        });

        authSubmitBtn.addEventListener('click', async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            if(!username || !password) return alert("Please fill fields");

            const path = isLoginMode ? '/api/login' : '/api/register';
            const response = await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const result = await response.json();

            if (result.success) {
                if (!isLoginMode) {
                    alert("Registration successful! Please login.");
                    isLoginMode = true;
                    authSwitchMode.click();
                } else {
                    myUsername = username;
                    initializeChatSystem();
                }
            } else {
                alert(result.error || "Authentication failed");
            }
        });

        function initializeChatSystem() {
            authOverlay.style.display = "none";
            appScreen.style.display = "flex";
            document.getElementById('welcomeLabel').textContent = `GDChat (${myUsername})`;

            socket = io();
            socket.emit('registerOnlineUser', myUsername);

            socket.on('updateUserList', (users) => {
                const userListDiv = document.getElementById('userList');
                userListDiv.innerHTML = "";
                users.forEach(user => {
                    if (user !== myUsername) {
                        const item = document.createElement('div');
                        item.className = 'user-item';
                        item.textContent = user;
                        item.onclick = () => selectContactUser(user);
                        userListDiv.appendChild(item);
                    }
                });
            });

            socket.on('chatHistory', (messages) => {
                const chatScreen = document.getElementById('chatScreen');
                chatScreen.innerHTML = "";
                messages.forEach(renderSingleBubble);
            });

            socket.on('incomingMessage', (msg) => {
                if ((msg.sender === myUsername && msg.receiver === activeTargetUser) || 
                    (msg.sender === activeTargetUser && msg.receiver === myUsername)) {
                    renderSingleBubble(msg);
                }
            });

            socket.on('messageDeleted', (msgId) => {
                const bubble = document.getElementById(`msg-${msgId}`);
                if (bubble) bubble.remove();
            });
        }

        function selectContactUser(targetUser) {
            activeTargetUser = targetUser;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('messageInput').placeholder = `Message ${targetUser}...`;
            socket.emit('loadHistory', targetUser);
        }

        function renderSingleBubble(msg) {
