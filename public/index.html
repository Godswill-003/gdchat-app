<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDChat Platform - Secure Entry</title>
    <style>
        :root {
            --bg-main: #0f141c;
            --bg-card: #18202c;
            --accent: #0fb682;
            --accent-hover: #0ca374;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border: #26354a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-container-box {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
        }

        .profile-picker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-preview {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background-color: var(--bg-main);
            border: 2px dashed var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-preview span {
            font-size: 24px;
            color: var(--text-muted);
        }

        .extra-options {
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .remember-me input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        .switch-prompt {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .switch-prompt a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .otp-box-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 24px 0;
        }

        .otp-input {
            width: 56px;
            height: 56px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
        }

        .otp-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(15, 182, 130, 0.2);
        }

        .resend-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 16px;
        }

        .resend-text span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="brand-header">
        <h1 id="main-title">Login ChatApp</h1>
        <p id="main-subtitle">Welcome back! Please enter your details.</p>
    </div>

    <!-- 🔑 PANEL 1: LOGIN -->
    <div class="form-panel active" id="login-panel">
        <div class="input-group">
            <label>Email or Phone Number</label>
            <input type="text" id="login-identifier" placeholder="example@mail.com or +234..." required />
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-container-box">
                <input type="password" id="login-password" placeholder="••••••" required />
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password', this)">Show</button>
            </div>
        </div>
        <div class="extra-options">
            <label class="remember-me">
                <input type="checkbox" id="login-remember"> Remember me
            </label>
        </div>
        <button class="submit-btn" onclick="submitLogin()">Login</button>
        <div class="switch-prompt">
            Don't have an account? <a href="#" onclick="switchPanel('signup')">Sign Up</a>
        </div>
    </div>

    <!-- 📝 PANEL 2: REGISTRATION -->
    <div class="form-panel" id="signup-panel">
        <div class="profile-picker-container">
            <div class="avatar-preview" onclick="document.getElementById('avatar-file').click()">
                <span id="avatar-icon">📷</span>
                <img id="avatar-img" src="" alt="Avatar Preview">
            </div>
            <input type="file" id="avatar-file" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
            <label style="font-size: 12px; color: var(--text-muted);">Upload Profile Picture</label>
        </div>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="signup-username" placeholder="Choose a public username" required />
        </div>
        <div class="input-group">
            <label>Contact Type</label>
            <select id="signup-type" onchange="toggleSignupInput()" style="width:100%; background:var(--bg-main); border:1px solid var(--border); padding:12px; border-radius:8px; color:white; outline:none;">
                <option value="email">Email Address</option>
                <option value="phone">Phone Number</option>
            </select>
        </div>
        <div class="input-group">
            <label id="signup-contact-label">Email Address</label>
            <input type="text" id="signup-contact" placeholder="name@domain.com" required />
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-container-box">
                <input type="password" id="signup-password" placeholder="Create secure password" required />
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signup-password', this)">Show</button>
            </div>
        </div>
        <button class="submit-btn" onclick="submitSignup()">Create Account</button>
        <div class="switch-prompt">
            Already have an account? <a href="#" onclick="switchPanel('login')">Login</a>
        </div>
    </div>

    <!-- 💬 PANEL 3: WHATSAPP-STYLE OTP VERIFICATION -->
    <div class="form-panel" id="otp-panel">
        <div style="text-align: center; margin-bottom: 16px;">
            <p style="font-size: 14px; color: var(--text-muted);">We sent a 4-digit verification code to:</p>
