<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Core Gateway</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="auth-container">
    <div class="brand-header">
        <h1 id="main-title">GDChat Stream</h1>
        <p id="main-subtitle">Access your global streaming portal</p>
    </div>

    <div class="form-panel active" id="login-panel">
        <div class="input-group"><label>Identifier</label><input type="text" id="login-identifier" placeholder="Username/Contact" /></div>
        <div class="input-group"><label>Password</label><input type="password" id="login-password" placeholder="••••••" /></div>
        <button class="submit-btn" onclick="submitLogin()">Login Gateway</button>
        <div class="switch-prompt">Need an account? <a href="#" onclick="switchPanel('signup')">Sign Up</a></div>
    </div>

    <div class="form-panel" id="signup-panel">
        <div class="input-group"><label>Select Profile Avatar</label><input type="file" id="avatar-file" accept="image/*" onchange="readAvatarString(event)" /></div>
        <div class="input-group"><label>Username</label><input type="text" id="signup-username" placeholder="Choose username" /></div>
        <div class="input-group"><label>Type</label><select id="signup-type"><option value="email">Email Address</option><option value="phone">Phone Number</option></select></div>
        <div class="input-group"><label>Contact</label><input type="text" id="signup-contact" placeholder="Destination link details" /></div>
        <div class="input-group"><label>Password</label><input type="password" id="signup-password" placeholder="Secure token passcode" /></div>
        <button class="submit-btn" onclick="submitSignup()">Register Profiles</button>
        <div class="switch-prompt">Registered? <a href="#" onclick="switchPanel('login')">Login</a></div>
    </div>

    <div class="form-panel" id="otp-panel">
        <div class="otp-box-container">
            <input type="text" class="otp-input" id="otp1" maxlength="1" oninput="moveFocus(this,'otp2')">
            <input type="text" class="otp-input" id="otp2" maxlength="1" oninput="moveFocus(this,'otp3')">
            <input type="text" class="otp-input" id="otp3" maxlength="1" oninput="moveFocus(this,'otp4')">
            <input type="text" class="otp-input" id="otp4" maxlength="1" oninput="verifyOtpSubmit()">
        </div>
        <button class="submit-btn" onclick="verifyOtpSubmit()">Confirm OTP Entry</button>
    </div>
</div>

<script>
    let sessionTarget = "", base64Avatar = "";
    function switchPanel(t) {
        document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(t+'-panel').classList.add('active');
    }
    function readAvatarString(e) {
        const r = new FileReader();
        r.onload = () => base64Avatar = r.result;
        if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
    }
    function moveFocus(c, n) { if(c.value.length === 1) document.getElementById(n).focus(); }

    async function submitLogin() {
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;
        const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({identifier, password}) });
        const d = await res.json();
        if(!res.ok) return alert(d.error);
        sessionTarget = identifier; switchPanel('otp');
    }
    async function submitSignup() {
        const username = document.getElementById('signup-username').value.trim();
        const contact = document.getElementById('signup-contact').value.trim();
        const password = document.getElementById('signup-password').value;
        const type = document.getElementById('signup-type').value;
        const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, contact, password, type, avatar:base64Avatar}) });
        const d = await res.json();
        if(!res.ok) return alert(d.error);
        sessionTarget = contact; switchPanel('otp');
    }
    async function verifyOtpSubmit() {
        const code = document.getElementById('otp1').value + document.getElementById('otp2').value + document.getElementById('otp3').value + document.getElementById('otp4').value;
        const res = await fetch('/verify-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({identifier:sessionTarget, code}) });
        const d = await res.json();
        if(!res.ok) return alert(d.error);
        localStorage.setItem('chatUser', JSON.stringify(d.user));
        window.location.href = "/appview.html";
    }
</script>
</body>
</html>
