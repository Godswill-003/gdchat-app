<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDChat Platform - Chatroom</title>
    <style>
        :root {
            --bg-main: #0f141c;
            --bg-card: #18202c;
            --accent: #0fb682;
            --accent-hover: #0ca374;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border: #26354a;
            --bubble-sent: #0ca374;
            --bubble-received: #26354a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
        }

        /* Top Header Bar */
        .chat-header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            background-color: var(--bg-main);
        }

        .header-username {
            font-weight: 600;
            font-size: 16px;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* 💬 Messages View Screen Container */
        .chat-screen {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #0c0f16;
        }

        /* Chat Bubbles Layout */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            animation: popIn 0.2s ease-out;
            word-wrap: break-word;
        }

        .message.sent {
            background-color: var(--bubble-sent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            background-color: var(--bubble-received);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message .username {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .message.sent .username {
            color: #d1fae5;
        }

        .message .text {
            font-size: 15px;
            line-height: 1.4;
        }

        .message .time {
            font-size: 10px;
            align-self: flex-end;
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Bottom Entry Text Input Bar */
        .chat-input-area {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 14px 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header Area -->
    <div class="chat-header">
        <div class="user-profile-info">
            <img id="my-avatar" class="header-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='40' height='40' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%2326354a'/></svg>" alt="Profile Picture">
            <span id="my-username-display" class="header-username">Loading...</span>
        </div>
        <button class="logout-btn" onclick="logoutSession()">Logout</button>
    </div>

    <!-- 💬 Messages View Screen Container -->
    <div class="chat-screen" id="chatScreen">
        <!-- Messages inject here dynamically -->
    </div>

    <!-- Bottom Entry Text Input Bar -->
    <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="Type your message here..." onkeypress="handleKeyPress(event)" />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➔</button>
    </div>
</div>

<!-- Socket.io connection logic -->
<script src="/socket.io/socket.io.js"></script>
<script>
    let socket;
    let myUsername = "Anonymous";

    // 1. Check user login status on initialization
    document.addEventListener("DOMContentLoaded", () => {
        const storedUser = localStorage.getItem('chatUser');
        if (!storedUser) {
            // No valid user session found, send them back to login page
            window.location.href = "/index.html";
            return;
        }

        const user = JSON.parse(storedUser);
        myUsername = user.username;
        document.getElementById('my-username-display').innerText = myUsername;

        // Load profile avatar photo string if it exists
        if(user.avatar && user.avatar.trim() !== "") {
            document.getElementById('my-avatar').src = user.avatar;
        }

        initializeChatSystem();
    });

    // 2. Open Websocket Pipelines
    function initializeChatSystem() {
        socket = io();

        // Broadcast presence status up to server pipelines
        socket.emit('join_room', myUsername);

        // 📥 RECEIVING A CHAT MESSAGE FROM THE SERVER
        socket.on('receive_message', (data) => {
            const chatWindow = document.getElementById('chatScreen'); 
            if (!chatWindow) return;

            const messageDiv = document.createElement('div');
            
            if (data.sender === myUsername) {
                messageDiv.className = 'message sent';
            } else {
                messageDiv.className = 'message received';
            }

            messageDiv.innerHTML = `
                <span class="username"><b>${data.sender}</b></span>
                <p class="text">${data.message}</p>
                <span class="time">${data.timestamp}</span>
            `;

            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight; // Keep view auto-scrolled down
        });

        // 📢 RECEIVING SYSTEM MESSAGES (Joins/Leaves)
        socket.on('system_message', (text) => {
            const chatWindow = document.getElementById('chatScreen');
            if (!chatWindow) return;

            const systemDiv = document.createElement('div');
            systemDiv.className = 'system-notification';
            systemDiv.style.textAlign = 'center';
            systemDiv.style.color = '#727272';
            systemDiv.style.margin = '10px 0';
            systemDiv.style.fontSize = '13px';
            systemDiv.innerText = text;
            
            chatWindow.appendChild(systemDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    }

    // 📤 FUNCTION TO TRANSMIT INPUT VALUES TO BACKEND
    function sendMessage() {
        const messageInput = document.getElementById('message-input'); 
        const messageText = messageInput.value.trim();

        if (messageText !== "" && socket) {
            socket.emit('send_message', {
                sender: myUsername, 
                message: messageText
            });
            messageInput.value = ''; 
        }
    }

    // Allow the Enter key to submit messages automatically
    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    function logoutSession() {
        localStorage.removeItem('chatUser');
        window.location.href = "/index.html";
    }
</script>
</body>
    </html>
